  <div id="root" style="width: 100%;"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_URL = 'http://localhost:5000/api';

    // Sample Student Roster Data
    const INITIAL_STUDENTS = [
      { id: '2026-0001', name: 'Ian Pollosco Umadac', course: 'BSIT', yearLevel: '2nd Year', section: '2A', email: 'ian.umadac@sjc.edu.ph', status: 'Enrolled' },
      { id: '2026-0002', name: 'Maria Santos', course: 'BSBA', yearLevel: '3rd Year', section: '3B', email: 'maria.santos@sjc.edu.ph', status: 'Enrolled' },
      { id: '2026-0003', name: 'Juan Dela Cruz', course: 'BSIT', yearLevel: '1st Year', section: '1A', email: 'juan.delacruz@sjc.edu.ph', status: 'Enrolled' },
      { id: '2026-0004', name: 'Angelica Reyes', course: 'BSED', yearLevel: '2nd Year', section: '2B', email: 'angelica.reyes@sjc.edu.ph', status: 'Enrolled' },
      { id: '2026-0005', name: 'Mark Anthony Cruz', course: 'BSIT', yearLevel: '4th Year', section: '4A', email: 'mark.cruz@sjc.edu.ph', status: 'Enrolled' }
    ];

    function App() {
      const [theme, setTheme] = useState('light');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [user, setUser] = useState({ name: '', email: '', password: '', role: 'Student', department: 'HEU' });
      const [showPassword, setShowPassword] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [activeModal, setActiveModal] = useState(null); // 'academics' | 'admissions' | 'campus' | 'cics' | 'cas' | 'cbm'
      const [previewImage, setPreviewImage] = useState(null); // Lightbox selected image source

      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [studentSearch, setStudentSearch] = useState('');
      const [subjects, setSubjects] = useState([]);
      const [evaluations, setEvaluations] = useState([]);
      const [evalForm, setEvalForm] = useState({ subjectId: '', rating: '5', comments: '' });
      const [regForm, setRegForm] = useState({ name: '', email: '', role: 'Student', department: 'HEU' });

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);

      useEffect(() => {
        if (isLoggedIn) {
          fetchSubjects();
          fetchEvaluations();
        }
      }, [isLoggedIn]);

      const toggleTheme = () => setTheme(prev => (prev === 'light' ? 'dark' : 'light'));

      const handleLogin = (e) => {
        e.preventDefault();
        if (!user.name || !user.email) {
          alert('Please enter your name and email/username.');
          return;
        }
        axios.post(`${API_URL}/register`, user)
          .then(() => setIsLoggedIn(true))
          .catch(() => setIsLoggedIn(true));
      };

      const fetchSubjects = () => {
        axios.get(`${API_URL}/subjects`)
          .then(res => setSubjects(res.data))
          .catch(() => {
            setSubjects([
              { id: 101, code: 'IT201', name: 'Data Structures & Algorithms', instructor: 'Prof. Santos', department: 'HEU' },
              { id: 102, code: 'IT202', name: 'Web Programming (React & Node)', instructor: 'Prof. Reyes', department: 'HEU' },
              { id: 103, code: 'ENG101', name: 'Academic Writing & Communication', instructor: 'Prof. Cruz', department: 'BEU' }
            ]);
          });
      };

      const fetchEvaluations = () => {
        axios.get(`${API_URL}/evaluations`)
          .then(res => setEvaluations(res.data))
          .catch(err => console.error(err));
      };

      const handleEvaluationSubmit = (e) => {
        e.preventDefault();
        axios.post(`${API_URL}/evaluations`, { studentName: user.name, ...evalForm })
          .then(() => {
            alert('Evaluation submitted successfully!');
            setEvalForm({ subjectId: '', rating: '5', comments: '' });
            fetchEvaluations();
            setActiveTab('evaluations-list');

                              <td><span className="badge-dept">{sub.department}</span></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}

                  {activeTab === 'evaluate' && (
                    <div className="content-card" style={{ maxWidth: '650px' }}>
                      <h3><i className="fa-solid fa-pen-to-square" style={{ color: 'var(--primary)' }}></i> Faculty Evaluation Form</h3>
                      <form onSubmit={handleEvaluationSubmit}>
                        <div className="form-group">
                          <label>Select Enrolled Subject & Instructor</label>
                          <select required value={evalForm.subjectId} onChange={e => setEvalForm({ ...evalForm, subjectId: e.target.value })}>
                            <option value="">-- Choose Subject --</option>
                            {subjects.map(sub => (
                              <option key={sub.id} value={sub.id}>
                                {sub.code} - {sub.name} ({sub.instructor})
                              </option>
                            ))}
                          </select>
                        </div>

                        <div className="form-group">
                          <label>Performance Rating (1 - 5 Stars)</label>
                          <select value={evalForm.rating} onChange={e => setEvalForm({ ...evalForm, rating: e.target.value })}>
                            <option value="5">⭐⭐⭐⭐⭐ (5 - Outstanding)</option>
                            <option value="4">⭐⭐⭐⭐ (4 - Very Satisfactory)</option>
                            <option value="3">⭐⭐⭐ (3 - Satisfactory)</option>
                            <option value="2">⭐⭐ (2 - Fair)</option>
                            <option value="1">⭐ (1 - Poor)</option>
                          </select>
                        </div>

                        <div className="form-group">
                          <label>Constructive Comments / Feedback</label>
                          <textarea rows="4" placeholder="Enter evaluation comments..." value={evalForm.comments} onChange={e => setEvalForm({ ...evalForm, comments: e.target.value })}></textarea>
                        </div>

                        <button type="submit" className="btn-submit">Submit Faculty Evaluation</button>
                      </form>
                    </div>
                  )}

                  {activeTab === 'evaluations-list' && (
                    <div className="content-card">
                      <h3><i className="fa-solid fa-list-check" style={{ color: 'var(--primary)' }}></i> Evaluation Records</h3>
                      <table>
                        <thead>
                          <tr>
                            <th>Student</th>
                            <th>Subject ID</th>
                            <th>Rating</th>
                            <th>Comments</th>
                            <th>Date</th>
                          </tr>
                        </thead>
                        <tbody>
                          {evaluations.map(ev => (
                            <tr key={ev.id}>
                              <td>{ev.studentName}</td>
                              <td>{ev.subjectId}</td>
                              <td><b>{ev.rating} / 5 ⭐</b></td>
                              <td>{ev.comments || 'N/A'}</td>
                              <td>{new Date(ev.submittedAt).toLocaleDateString()}</td>
                            </tr>
                          ))}
                          {evaluations.length === 0 && (
                            <tr>
                              <td colSpan="5" style={{ textAlign: 'center', color: 'var(--text-muted)' }}>No evaluation records found.</td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  )}

                  {activeTab === 'register' && (
                    <div className="content-card" style={{ maxWidth: '650px' }}>
                      <h3><i className="fa-solid fa-user-plus" style={{ color: 'var(--primary)' }}></i> User Registration Form</h3>
                      <form onSubmit={handleUserRegistration}>
                        <div className="form-group">
                          <label>Full Name</label>
                          <input type="text" required placeholder="Enter full name" value={regForm.name} onChange={e => setRegForm({ ...regForm, name: e.target.value })} />
                        </div>
                        <div className="form-group">
                          <label>Email Address</label>
                          <input type="email" required placeholder="Enter email address" value={regForm.email} onChange={e => setRegForm({ ...regForm, email: e.target.value })} />
                        </div>
                        <div className="form-group">
                          <label>Department</label>
                          <select value={regForm.department} onChange={e => setRegForm({ ...regForm, department: e.target.value })}>
                            <option value="HEU">Higher Education Unit (HEU)</option>
                            <option value="BEU">Basic Education Unit (BEU)</option>
                          </select>
                        </div>
                        <div className="form-group">
                          <label>System Role</label>
                          <select value={regForm.role} onChange={e => setRegForm({ ...regForm, role: e.target.value })}>
                            <option value="Student">Student</option>
                            <option value="Faculty">Faculty</option>
                            <option value="Admin">Administrator</option>
                          </select>
                        </div>
                        <button type="submit" className="btn-submit">Register User Account</button>
                      </form>
                    </div>
                  )}
                </main>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
